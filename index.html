<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- El título anterior era "DUALINK | Tecnología que trabaja por ti":
         no contenía "Solutions", que es justo como os busca la gente.
         Por eso no salíais ni buscando vuestro propio nombre. -->
    <title>Dualink Solutions | Agentes de IA, automatización y software a medida</title>
    <meta
      name="description"
      content="Dualink Solutions: agentes de IA que atienden a tus clientes 24/7, automatización, software a medida, diseño web y gestión de redes sociales. Pagas por fases, nunca todo por adelantado. Tudela, Navarra."
    />
    <link rel="canonical" href="https://www.dualinksolutions.com/" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph: controla cómo se ve el enlace al compartirlo por
         WhatsApp, que es por donde vais a mover la web -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dualink Solutions" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://www.dualinksolutions.com/" />
    <meta
      property="og:title"
      content="Dualink Solutions | Agentes de IA, automatización y software a medida"
    />
    <meta
      property="og:description"
      content="Agentes de IA que atienden a tus clientes 24/7, automatización y software a medida. Pagas por fases, nunca todo por adelantado."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Datos estructurados: ayudan a Google a entender que la marca
         "Dualink Solutions" es esta empresa, y a mostrar el panel de
         negocio local al buscarla por su nombre. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Dualink Solutions",
        "url": "https://www.dualinksolutions.com/",
        "description": "Agentes de IA, automatización, software a medida, diseño web y gestión de redes sociales para pymes.",
        "telephone": "+34692918737",
        "email": "info@dualinksolutions.com",
        "areaServed": "ES",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Tudela",
          "addressRegion": "Navarra",
          "addressCountry": "ES"
        },
        "sameAs": []
      }
    </script>
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
